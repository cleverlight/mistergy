<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 620">
  <!-- Background -->
  <rect width="740" height="620" fill="#ffffff" rx="6"/>

  <!-- Title -->
  <text x="370" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#24292f">Annular Prismatic Core — Cross-Section</text>
  <text x="370" y="52" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#57606a">Plan view, not to scale</text>

  <!-- Core centred at (310, 310) -->
  <!-- Scale: 1m = 95px -->

  <!-- RPV wall -->
  <circle cx="310" cy="310" r="261" fill="none" stroke="#37474f" stroke-width="8"/>
  <!-- RPV fill (between vessel wall and outer reflector) -->
  <circle cx="310" cy="310" r="257" fill="#eceff1" stroke="none"/>

  <!-- Outer reflector -->
  <circle cx="310" cy="310" r="219" fill="#b0bec5" stroke="#90a4ae" stroke-width="1.5"/>

  <!-- Fuel annulus -->
  <circle cx="310" cy="310" r="171" fill="#ff8f00" stroke="#ef6c00" stroke-width="1"/>

  <!-- Hexagonal block pattern suggestion in fuel annulus -->
  <!-- Row of hex outlines to suggest prismatic blocks -->
  <g stroke="#e65100" stroke-width="0.8" fill="none" opacity="0.5">
    <!-- Top hex blocks -->
    <polygon points="310,155 330,167 330,191 310,203 290,191 290,167"/>
    <polygon points="350,170 370,182 370,206 350,218 330,206 330,182"/>
    <polygon points="270,170 290,182 290,206 270,218 250,206 250,182"/>
    <polygon points="390,195 410,207 410,231 390,243 370,231 370,207"/>
    <polygon points="230,195 250,207 250,231 230,243 210,231 210,207"/>
    <!-- Middle row -->
    <polygon points="410,235 430,247 430,271 410,283 390,271 390,247"/>
    <polygon points="210,235 230,247 230,271 210,283 190,271 190,247"/>
    <polygon points="420,275 440,287 440,311 420,323 400,311 400,287"/>
    <polygon points="200,275 220,287 220,311 200,323 180,311 180,287"/>
    <!-- Bottom blocks -->
    <polygon points="410,315 430,327 430,351 410,363 390,351 390,327"/>
    <polygon points="200,315 220,327 220,351 200,363 180,351 180,327"/>
    <polygon points="390,355 410,367 410,391 390,403 370,391 370,367"/>
    <polygon points="230,355 250,367 250,391 230,403 210,391 210,367"/>
    <polygon points="350,380 370,392 370,416 350,428 330,416 330,392"/>
    <polygon points="270,380 290,392 290,416 270,428 250,416 250,392"/>
    <polygon points="310,395 330,407 330,431 310,443 290,431 290,407"/>
  </g>

  <!-- Inner reflector -->
  <circle cx="310" cy="310" r="76" fill="#cfd8dc" stroke="#90a4ae" stroke-width="1.5"/>

  <!-- Control rod positions in inner reflector -->
  <g fill="#1565c0" stroke="#0d47a1" stroke-width="1">
    <circle cx="310" cy="270" r="8"/>
    <circle cx="345" cy="290" r="8"/>
    <circle cx="345" cy="330" r="8"/>
    <circle cx="310" cy="350" r="8"/>
    <circle cx="275" cy="330" r="8"/>
    <circle cx="275" cy="290" r="8"/>
  </g>

  <!-- Labels -->
  <!-- Inner reflector label -->
  <text x="310" y="307" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#37474f">INNER</text>
  <text x="310" y="319" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#37474f">REFLECTOR</text>

  <!-- Fuel annulus label (curved would be ideal, but use straight) -->
  <text x="310" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#bf360c">FUEL ANNULUS</text>
  <text x="310" y="164" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#bf360c">(prismatic blocks)</text>

  <!-- Outer reflector label -->
  <text x="535" y="305" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#546e7a">OUTER</text>
  <text x="535" y="319" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#546e7a">REFLECTOR</text>
  <line x1="529" y1="310" x2="498" y2="310" stroke="#546e7a" stroke-width="1"/>
  <polygon points="500,310 507,307 507,313" fill="#546e7a"/>

  <!-- RPV label -->
  <text x="595" y="345" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#37474f">RPV</text>
  <line x1="589" y1="342" x2="572" y2="325" stroke="#37474f" stroke-width="1"/>
  <circle cx="572" cy="325" r="2" fill="#37474f"/>

  <!-- Control rod label -->
  <text x="595" y="250" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#1565c0">Control rods</text>
  <line x1="589" y1="248" x2="352" y2="287" stroke="#1565c0" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Dimension lines -->
  <!-- Inner reflector radius: 0.8m -->
  <line x1="310" y1="530" x2="386" y2="530" stroke="#24292f" stroke-width="1"/>
  <line x1="310" y1="524" x2="310" y2="536" stroke="#24292f" stroke-width="1"/>
  <line x1="386" y1="524" x2="386" y2="536" stroke="#24292f" stroke-width="1"/>
  <text x="348" y="526" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#24292f">0.8 m</text>

  <!-- Fuel annulus outer radius: 1.8m -->
  <line x1="310" y1="550" x2="481" y2="550" stroke="#24292f" stroke-width="1"/>
  <line x1="310" y1="544" x2="310" y2="556" stroke="#24292f" stroke-width="1"/>
  <line x1="481" y1="544" x2="481" y2="556" stroke="#24292f" stroke-width="1"/>
  <text x="396" y="546" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#24292f">1.8 m</text>

  <!-- Outer reflector outer radius: 2.3m -->
  <line x1="310" y1="570" x2="529" y2="570" stroke="#24292f" stroke-width="1"/>
  <line x1="310" y1="564" x2="310" y2="576" stroke="#24292f" stroke-width="1"/>
  <line x1="529" y1="564" x2="529" y2="576" stroke="#24292f" stroke-width="1"/>
  <text x="420" y="566" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#24292f">2.3 m</text>

  <!-- RPV radius: ~2.75m -->
  <line x1="310" y1="590" x2="571" y2="590" stroke="#24292f" stroke-width="1"/>
  <line x1="310" y1="584" x2="310" y2="596" stroke="#24292f" stroke-width="1"/>
  <line x1="571" y1="584" x2="571" y2="596" stroke="#24292f" stroke-width="1"/>
  <text x="441" y="606" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#24292f">RPV radius ~2.75 m (OD ~5.5 m)</text>

  <!-- Dashed centre line -->
  <line x1="310" y1="65" x2="310" y2="525" stroke="#bdbdbd" stroke-width="0.5" stroke-dasharray="6,4"/>
</svg>
