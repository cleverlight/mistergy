<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480">
  <!-- Background -->
  <rect width="780" height="480" fill="#ffffff" rx="6"/>

  <!-- Title -->
  <text x="390" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#24292f">TRISO Coated Fuel Particle — Cross-Section</text>

  <!-- Particle centred at (210, 240) -->

  <!-- OPyC outer layer -->
  <circle cx="210" cy="240" r="158" fill="#607d8b" stroke="#455a64" stroke-width="1.5"/>
  <!-- SiC layer — emphasized as primary barrier -->
  <circle cx="210" cy="240" r="142" fill="#00897b" stroke="#00695c" stroke-width="2.5"/>
  <!-- IPyC layer -->
  <circle cx="210" cy="240" r="124" fill="#78909c" stroke="#607d8b" stroke-width="1"/>
  <!-- Buffer layer (porous — dashed outline + stipple) -->
  <circle cx="210" cy="240" r="110" fill="#eceff1" stroke="#b0bec5" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Porosity stipple dots in buffer -->
  <g fill="#b0bec5" opacity="0.5">
    <circle cx="140" cy="210" r="1.3"/><circle cx="150" cy="200" r="1.1"/><circle cx="128" cy="225" r="1.3"/>
    <circle cx="135" cy="240" r="1.1"/><circle cx="128" cy="255" r="1.3"/><circle cx="140" cy="268" r="1.1"/>
    <circle cx="155" cy="278" r="1.3"/><circle cx="148" cy="195" r="1.1"/><circle cx="265" cy="195" r="1.3"/>
    <circle cx="275" cy="210" r="1.1"/><circle cx="285" cy="225" r="1.3"/><circle cx="285" cy="245" r="1.1"/>
    <circle cx="278" cy="260" r="1.3"/><circle cx="268" cy="275" r="1.1"/><circle cx="255" cy="282" r="1.3"/>
    <circle cx="118" cy="238" r="1.1"/><circle cx="298" cy="240" r="1.1"/>
    <circle cx="175" cy="150" r="1.1"/><circle cx="245" cy="150" r="1.1"/>
    <circle cx="175" cy="330" r="1.1"/><circle cx="245" cy="330" r="1.1"/>
  </g>
  <!-- UO₂ kernel -->
  <circle cx="210" cy="240" r="82" fill="#bf360c" stroke="#8e2600" stroke-width="1.5"/>
  <text x="210" y="234" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">UO₂</text>
  <text x="210" y="252" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#ffccbc">4.8% ²³⁵U</text>

  <!-- Leader lines to labels (right side) -->

  <!-- Kernel -->
  <line x1="275" y1="188" x2="448" y2="82" stroke="#9e9e9e" stroke-width="1"/>
  <circle cx="275" cy="188" r="2.5" fill="#9e9e9e"/>
  <text x="453" y="72" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#bf360c">UO₂ Kernel</text>
  <text x="453" y="88" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#57606a">500 μm diameter</text>
  <text x="453" y="103" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#78909c" font-style="italic">Retains most fission products in ceramic</text>

  <!-- Buffer -->
  <line x1="308" y1="172" x2="448" y2="135" stroke="#9e9e9e" stroke-width="1"/>
  <circle cx="308" cy="172" r="2.5" fill="#9e9e9e"/>
  <text x="453" y="131" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#78909c">Buffer</text>
  <text x="453" y="147" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#57606a">100 μm · Porous PyC</text>
  <text x="453" y="162" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#78909c" font-style="italic">Fission gas plenum; accommodates swelling</text>

  <!-- IPyC -->
  <line x1="322" y1="198" x2="448" y2="192" stroke="#9e9e9e" stroke-width="1"/>
  <circle cx="322" cy="198" r="2.5" fill="#9e9e9e"/>
  <text x="453" y="188" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#607d8b">IPyC</text>
  <text x="453" y="204" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#57606a">40 μm · Dense PyC</text>
  <text x="453" y="219" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#78909c" font-style="italic">Gas-tight seal; structural support for SiC</text>

  <!-- SiC — emphasized -->
  <line x1="342" y1="220" x2="448" y2="250" stroke="#00695c" stroke-width="1.5"/>
  <circle cx="342" cy="220" r="3" fill="#00695c"/>
  <text x="453" y="248" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#00695c">SiC ★</text>
  <text x="453" y="265" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#57606a">35 μm · β-SiC (CVD)</text>
  <text x="453" y="280" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#00695c" font-style="italic">Primary fission product pressure vessel</text>

  <!-- OPyC -->
  <line x1="355" y1="280" x2="448" y2="310" stroke="#9e9e9e" stroke-width="1"/>
  <circle cx="355" cy="280" r="2.5" fill="#9e9e9e"/>
  <text x="453" y="308" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#455a64">OPyC</text>
  <text x="453" y="324" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#57606a">40 μm · Dense PyC</text>
  <text x="453" y="339" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#78909c" font-style="italic">Structural protection; bonds to matrix graphite</text>

  <!-- Temperature limit callout -->
  <rect x="448" y="365" width="210" height="42" rx="4" fill="#fce4ec" stroke="#c62828" stroke-width="1"/>
  <text x="553" y="383" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#c62828">Intact to 1,600 °C</text>
  <text x="553" y="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#c62828">SiC coating integrity demonstrated</text>

  <!-- Total OD dimension line -->
  <line x1="52" y1="438" x2="368" y2="438" stroke="#24292f" stroke-width="1"/>
  <line x1="52" y1="432" x2="52" y2="444" stroke="#24292f" stroke-width="1.5"/>
  <line x1="368" y1="432" x2="368" y2="444" stroke="#24292f" stroke-width="1.5"/>
  <polygon points="57,438 65,435 65,441" fill="#24292f"/>
  <polygon points="363,438 355,435 355,441" fill="#24292f"/>
  <text x="210" y="456" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#24292f">Total OD ≈ 930 μm</text>

  <!-- Actual size reference -->
  <circle cx="210" cy="468" r="0.8" fill="#24292f"/>
  <text x="225" y="472" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#9e9e9e">← approximate actual size</text>
</svg>
