<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
  <defs>
    <style>
      text { font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif; fill: #12242E; }
      .title { font-size: 32px; font-weight: 700; letter-spacing: -0.2px; }
      .subtitle { font-size: 12.5px; font-weight: 400; letter-spacing: 0.3px; fill: #5A7280; }
      .marker { font-size: 9.5px; font-weight: 700; letter-spacing: 1.1px; fill: #5A7280; }
      .panelhdr { font-size: 12px; font-weight: 700; letter-spacing: 1.1px; }
      .panelnote { font-size: 9.5px; font-weight: 400; fill: #5A7280; }
      .callhdr { font-size: 11px; font-weight: 700; letter-spacing: 0.2px; }
      .callbody { font-size: 9.5px; font-weight: 400; }
      .dlabel { font-size: 10px; font-weight: 400; }
      .dvalue { font-size: 10px; font-weight: 700; }
      .statval { font-size: 19px; font-weight: 700; }
      .statlbl { font-size: 8.5px; font-weight: 400; letter-spacing: 0.6px; fill: #90A4AE; }
      .foot { font-size: 8.5px; font-weight: 400; fill: #90A4AE; }
      .muted { fill: #5A7280; }
      .faint { fill: #90A4AE; }
    </style>
    <marker id="arrIR" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#B3261E"/>
    </marker>
    <marker id="arrE" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4B3F9E"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2F6FD0"/>
    </marker>
  </defs>

  <rect width="1600" height="1060" fill="#FBFAF7"/>

  <text class="title" x="40" y="52">He-3 Programme - System Architecture</text>
  <text class="subtitle" x="40" y="74">The beam chain from array to user station. The gamma conversion stage is a GeV-class particle accelerator, drawn here at true weight.</text>
  <text class="marker" x="1560" y="52" text-anchor="end">HE-3 PROGRAMME · SYSTEM SET · SHEET 1 OF 3</text>
  <line x1="40" y1="88" x2="1560" y2="88" stroke="#DBE4E9" stroke-width="1"/>

  <g>
    <text class="statval" x="40" y="128">1-30 MeV</text><text class="statlbl" x="40" y="146">GAMMA BEAM BAND</text>
    <text class="statval" x="230" y="128">1.06-1.21 GeV</text><text class="statlbl" x="230" y="146">ELECTRON BEAM ENERGY</text>
    <text class="statval" x="450" y="128">1.7 x 10⁷</text><text class="statlbl" x="450" y="146">INVERSE COMPTON LEAP, 4γ²</text>
    <text class="statval" x="670" y="128">1-5 kW</text><text class="statlbl" x="670" y="146">ARRAY AVERAGE POWER</text>
    <text class="statval" x="860" y="128">100-500 TW</text><text class="statlbl" x="860" y="146">ARRAY PEAK POWER</text>
    <text class="statval" x="1060" y="128">10⁻⁴</text><text class="statlbl" x="1060" y="146">LASER TO GAMMA CONVERSION</text>
    <text class="statval" x="1260" y="128">~10 fs</text><text class="statlbl" x="1260" y="146">INTER-ARM TIMING BUDGET</text>
    <text class="statval" x="1430" y="128">1.5 x 10¹¹ /s</text><text class="statlbl" x="1430" y="146">GAMMA FLUX AT 5 kW</text>
  </g>
  <line x1="40" y1="168" x2="1560" y2="168" stroke="#DBE4E9" stroke-width="1"/>

  <g>
    <rect x="40" y="340" width="180" height="120" rx="3" fill="#FFFFFF" stroke="#CCD8DE" stroke-width="1.4"/>
    <rect x="40" y="340" width="180" height="22" rx="3" fill="#F2F6F8"/>
    <text class="panelhdr" x="50" y="356">1  LASER ARRAY</text>
    <text class="dlabel" x="50" y="384">N channels, 1030 nm</text>
    <text class="dvalue" x="50" y="402">1-5 kW average</text>
    <text class="dvalue" x="50" y="420">100-500 TW peak</text>
    <text class="callbody muted" x="50" y="444">04-laser-array</text>
  </g>

  <line x1="220" y1="400" x2="248" y2="400" stroke="#B3261E" stroke-width="3" marker-end="url(#arrIR)"/>

  <g>
    <rect x="250" y="340" width="170" height="120" rx="3" fill="#FFFFFF" stroke="#CCD8DE" stroke-width="1.4"/>
    <rect x="250" y="340" width="170" height="22" rx="3" fill="#F2F6F8"/>
    <text class="panelhdr" x="260" y="356">2  COMBINING</text>
    <text class="dlabel" x="260" y="384">phase locked</text>
    <text class="dvalue" x="260" y="402">λ/20 RMS, 51.5 nm</text>
    <text class="dlabel" x="260" y="420">pairwise sensing</text>
    <text class="callbody muted" x="260" y="444">07-ai-control §9</text>
  </g>

  <line x1="420" y1="400" x2="448" y2="400" stroke="#B3261E" stroke-width="3" marker-end="url(#arrIR)"/>

  <g>
    <rect x="450" y="340" width="100" height="120" rx="3" fill="#FFFFFF" stroke="#CCD8DE" stroke-width="1.4"/>
    <rect x="450" y="340" width="100" height="22" rx="3" fill="#F2F6F8"/>
    <text class="panelhdr" x="460" y="356">3  SPLIT</text>
    <text class="callbody" x="460" y="384">drive arm</text>
    <text class="callbody" x="460" y="400">scatter arm</text>
    <text class="callbody muted" x="460" y="426">sheet 2</text>
  </g>

  <path d="M550,372 L575,372 L575,300 L600,300" fill="none" stroke="#B3261E" stroke-width="3" marker-end="url(#arrIR)"/>
  <text class="callbody" x="556" y="290">drive</text>
  <path d="M550,430 L575,430 L575,650 L1152,650 L1152,514" fill="none" stroke="#B3261E" stroke-width="2" marker-end="url(#arrIR)"/>
  <text class="callbody" x="600" y="642">scattering arm, routed to the interaction point</text>

  <path d="M566,372 L566,430" fill="none" stroke="#C2410C" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text class="callbody" x="470" y="474" fill="#C2410C">timing link</text>
  <text class="callbody" x="470" y="488" fill="#C2410C">~10 fs RMS</text>

  <g>
    <rect x="600" y="230" width="380" height="300" rx="3" fill="#FFFFFF" stroke="#E8701A" stroke-width="2.6"/>
    <rect x="600" y="230" width="380" height="26" rx="3" fill="#FDEDE0"/>
    <text class="panelhdr" x="612" y="248" fill="#E8701A">4  LASER WAKEFIELD ACCELERATOR</text>
    <text class="panelnote" x="968" y="248" text-anchor="end">05-gamma-source</text>
    <text class="callhdr" x="612" y="284">This is not an optic.</text>
    <text class="callbody" x="612" y="304">A GeV-class particle accelerator, and the stage that</text>
    <text class="callbody" x="612" y="320">dominates cost, footprint and complexity.</text>
    <text class="dlabel" x="612" y="352">plasma stage</text><text class="dvalue" x="800" y="352">centimetres, not metres</text>
    <text class="dlabel" x="612" y="372">output</text><text class="dvalue" x="800" y="372">1.06-1.21 GeV electrons</text>
    <text class="dlabel" x="612" y="392">Lorentz factor γ</text><text class="dvalue" x="800" y="392">2,067 at threshold</text>
    <text class="dlabel" x="612" y="412">specify to</text><text class="dvalue" x="800" y="412">1.25 GeV with margin</text>
    <line x1="612" y1="432" x2="968" y2="432" stroke="#DBE4E9" stroke-width="1"/>
    <text class="callbody muted" x="612" y="454">Why the array suits it: wakefield accelerators lack</text>
    <text class="callbody muted" x="612" y="470">repetition rate and average power, which is exactly</text>
    <text class="callbody muted" x="612" y="486">what a combined fibre or thin-disk array is good at.</text>
    <text class="callbody muted" x="612" y="510">03-feasibility Part 4, the pivot.</text>
  </g>

  <line x1="982" y1="380" x2="1056" y2="380" stroke="#4B3F9E" stroke-width="3" marker-end="url(#arrE)"/>
  <text class="callbody" x="992" y="370" fill="#4B3F9E">e⁻ beam</text>

  <g>
    <rect x="1060" y="330" width="185" height="182" rx="3" fill="#FFFFFF" stroke="#CCD8DE" stroke-width="1.4"/>
    <rect x="1060" y="330" width="185" height="22" rx="3" fill="#F2F6F8"/>
    <text class="panelhdr" x="1070" y="346">5  INTERACTION</text>
    <text class="callhdr" x="1070" y="374">Inverse Compton</text>
    <text class="callbody" x="1070" y="394">E γ ≈ 4γ² E laser</text>
    <text class="callbody" x="1070" y="414">1.204 eV in</text>
    <text class="callbody" x="1070" y="430">20.578 MeV out</text>
    <text class="dvalue" x="1070" y="450">x 1.7 x 10⁷</text>
    <line x1="1070" y1="462" x2="1235" y2="462" stroke="#DBE4E9" stroke-width="1"/>
    <text class="callbody muted" x="1070" y="480">conversion 10⁻⁴</text>
    <text class="callbody muted" x="1070" y="496">§6.2 nearer 10⁻⁵</text>
  </g>

  <line x1="1245" y1="380" x2="1263" y2="380" stroke="#2F6FD0" stroke-width="3" marker-end="url(#arrG)"/>

  <g>
    <rect x="1265" y="330" width="120" height="182" rx="3" fill="#FFFFFF" stroke="#CCD8DE" stroke-width="1.4"/>
    <rect x="1265" y="330" width="120" height="22" rx="3" fill="#F2F6F8"/>
    <text class="panelhdr" x="1275" y="346">6  COLLIMATOR</text>
    <text class="callbody" x="1275" y="374">cone 1/γ</text>
    <text class="dvalue" x="1275" y="392">0.48 mrad</text>
    <text class="callbody" x="1275" y="416">aperture selects</text>
    <text class="callbody" x="1275" y="430">the energy band</text>
    <text class="callbody muted" x="1275" y="456">narrow band is</text>
    <text class="callbody muted" x="1275" y="470">the product</text>
  </g>

  <line x1="1385" y1="380" x2="1403" y2="380" stroke="#2F6FD0" stroke-width="3" marker-end="url(#arrG)"/>

  <g>
    <rect x="1405" y="330" width="155" height="182" rx="3" fill="#FFFFFF" stroke="#2F6FD0" stroke-width="2.2"/>
    <rect x="1405" y="330" width="155" height="22" rx="3" fill="#E7F0FB"/>
    <text class="panelhdr" x="1415" y="346" fill="#2F6FD0">7  USER STATION</text>
    <text class="callhdr" x="1415" y="374">The product</text>
    <text class="callbody" x="1415" y="394">tunable</text>
    <text class="callbody" x="1415" y="410">quasi-monochromatic</text>
    <text class="callbody" x="1415" y="426">polarised</text>
    <text class="callbody" x="1415" y="442">1-30 MeV</text>
    <text class="callbody muted" x="1415" y="468">section 14</text>
  </g>

  <g>
    <rect x="40" y="700" width="740" height="215" rx="3" fill="#FFFFFF" stroke="#CCD8DE" stroke-width="1.4"/>
    <rect x="40" y="700" width="740" height="22" rx="3" fill="#F2F6F8"/>
    <text class="panelhdr" x="50" y="716">THE ERROR THIS SHEET EXISTS TO CORRECT</text>
    <text class="callhdr" x="60" y="750">Drawn in the originating concept note</text>
    <rect x="60" y="760" width="290" height="54" rx="3" fill="#F7F9FA" stroke="#CCD8DE" stroke-width="1"/>
    <text class="callbody muted" x="72" y="782">[ Compton backscatter converter ]</text>
    <text class="callbody muted" x="72" y="800">one block, in a beam path</text>
    <text class="callhdr" x="420" y="750">What it actually is</text>
    <rect x="420" y="760" width="300" height="54" rx="3" fill="#FDEDE0" stroke="#E8701A" stroke-width="1.6"/>
    <text class="callbody" x="432" y="782">a 1.06-1.21 GeV particle accelerator</text>
    <text class="callbody" x="432" y="800">plus a synchronised second laser arm</text>
    <text class="callbody" x="60" y="850">That single substitution carried most of the system cost and complexity out of view. It is the reason the</text>
    <text class="callbody" x="60" y="866">concept note's architecture looked like an optical bench and costed like one.</text>
    <text class="callbody muted" x="60" y="894">01-overview §5, 05-gamma-source §1.</text>
  </g>

  <g>
    <rect x="810" y="700" width="750" height="215" rx="3" fill="#FFFFFF" stroke="#CCD8DE" stroke-width="1.4"/>
    <rect x="810" y="700" width="750" height="22" rx="3" fill="#F2F6F8"/>
    <text class="panelhdr" x="820" y="716">WHAT THE BEAM IS FOR</text>
    <text class="panelnote" x="1550" y="716" text-anchor="end">03-feasibility Part 4, section 14</text>
    <text class="callbody" x="820" y="746">The gamma beam is the product. Helium-3 production by this route was assessed and reassigned.</text>
    <text class="dvalue" x="820" y="776">1</text><text class="callbody" x="844" y="776">Photonuclear cross-section measurement, 8-30 MeV</text><text class="callbody muted" x="1330" y="776">the natural home</text>
    <text class="dvalue" x="820" y="800">2</text><text class="callbody" x="844" y="800">Nuclear resonance fluorescence assay, 2-8 MeV</text><text class="callbody muted" x="1330" y="800">flux limits throughput</text>
    <text class="dvalue" x="820" y="824">3</text><text class="callbody" x="844" y="824">Photofission studies, 6-20 MeV</text><text class="callbody muted" x="1330" y="824">licensing, not the beam</text>
    <text class="dvalue" x="820" y="848">4</text><text class="callbody" x="844" y="848">Medical isotope production, 12-25 MeV</text><text class="callbody muted" x="1330" y="848">five orders short</text>
    <line x1="820" y1="866" x2="1550" y2="866" stroke="#DBE4E9" stroke-width="1"/>
    <text class="callbody" x="820" y="888">The instrument would measure the ⁴He(γ,n)³He cross-section that this programme had to assume at ±2x.</text>
  </g>

  <line x1="40" y1="1000" x2="1560" y2="1000" stroke="#DBE4E9" stroke-width="1"/>
  <text class="foot" x="40" y="1018">Preliminary design - every value is an estimate awaiting calculation. All values traced to design/00-summary.md and the linked sections.</text>
</svg>
