<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480">
  <!-- Background -->
  <rect width="840" height="480" fill="#ffffff" rx="6"/>

  <!-- Title -->
  <text x="420" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#24292f">Defence in Depth — Five Barriers to Fission Product Release</text>
  <text x="420" y="46" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#78909c">Multi-scale radionuclide retention system (INL/NRC functional containment model)</text>

  <!-- ============================================ -->
  <!-- PANEL 1: TRISO Particle (Barriers 1 & 2)    -->
  <!-- Centered at (130, 235)                       -->
  <!-- ============================================ -->

  <!-- Panel background -->
  <rect x="30" y="62" width="210" height="350" rx="6" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>

  <!-- OPyC outer layer -->
  <circle cx="135" cy="225" r="78" fill="#607d8b" stroke="#455a64" stroke-width="1.5"/>
  <!-- SiC layer — emphasized with thicker ring -->
  <circle cx="135" cy="225" r="70" fill="#00897b" stroke="#00695c" stroke-width="2.5"/>
  <!-- IPyC layer -->
  <circle cx="135" cy="225" r="58" fill="#78909c" stroke="#607d8b" stroke-width="1"/>
  <!-- Buffer layer (porous) -->
  <circle cx="135" cy="225" r="50" fill="#eceff1" stroke="#b0bec5" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Stipple dots in buffer to suggest porosity -->
  <g fill="#b0bec5" opacity="0.5">
    <circle cx="110" cy="200" r="1.2"/><circle cx="120" cy="195" r="1"/><circle cx="100" cy="215" r="1.2"/>
    <circle cx="115" cy="210" r="1"/><circle cx="95" cy="230" r="1.2"/><circle cx="105" cy="240" r="1"/>
    <circle cx="112" cy="252" r="1.2"/><circle cx="100" cy="200" r="1"/><circle cx="158" cy="195" r="1.2"/>
    <circle cx="165" cy="210" r="1"/><circle cx="170" cy="225" r="1.2"/><circle cx="165" cy="240" r="1"/>
    <circle cx="158" cy="255" r="1.2"/><circle cx="120" cy="260" r="1"/><circle cx="150" cy="260" r="1.2"/>
    <circle cx="93" cy="220" r="1"/><circle cx="175" cy="220" r="1"/><circle cx="148" cy="190" r="1"/>
  </g>
  <!-- UO₂ kernel -->
  <circle cx="135" cy="225" r="36" fill="#bf360c" stroke="#8e2600" stroke-width="1.5"/>

  <!-- Barrier 1 label -->
  <text x="135" y="220" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">UO₂</text>
  <text x="135" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#ffccbc">Kernel</text>

  <!-- Barrier 1 callout -->
  <line x1="135" y1="189" x2="135" y2="80" stroke="#bf360c" stroke-width="1"/>
  <rect x="75" y="67" width="120" height="18" rx="3" fill="#bf360c"/>
  <text x="135" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">① Fuel Kernel</text>

  <!-- Barrier 2 callout — SiC emphasis -->
  <line x1="205" y1="225" x2="222" y2="225" stroke="#00695c" stroke-width="1"/>
  <circle cx="205" cy="225" r="2.5" fill="#00695c"/>
  <text x="52" y="340" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#00695c">② TRISO Coatings</text>
  <text x="52" y="355" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#546e7a">SiC layer is primary</text>
  <text x="52" y="367" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#546e7a">fission product barrier</text>

  <!-- SiC highlight arrow -->
  <line x1="206" y1="230" x2="215" y2="320" stroke="#00695c" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Particle scale note -->
  <text x="135" y="395" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#9e9e9e">~930 μm total diameter</text>

  <!-- ============================================ -->
  <!-- ZOOM LINE 1→2                                -->
  <!-- ============================================ -->
  <line x1="240" y1="190" x2="280" y2="140" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="240" y1="260" x2="280" y2="310" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ============================================ -->
  <!-- PANEL 2: Fuel Element (Barrier 3)            -->
  <!-- ============================================ -->

  <!-- Panel background -->
  <rect x="275" y="62" width="210" height="350" rx="6" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Hexagonal fuel block outline -->
  <polygon points="380,110 435,142 435,206 380,238 325,206 325,142" fill="#90a4ae" stroke="#607d8b" stroke-width="2"/>

  <!-- Graphite matrix fill -->
  <polygon points="380,115 430,145 430,203 380,233 330,203 330,145" fill="#b0bec5" stroke="none"/>

  <!-- TRISO particles embedded in graphite matrix -->
  <g fill="#bf360c" stroke="#8e2600" stroke-width="0.5">
    <circle cx="355" cy="148" r="5.5"/>
    <circle cx="375" cy="145" r="5.5"/>
    <circle cx="395" cy="148" r="5.5"/>
    <circle cx="345" cy="163" r="5.5"/>
    <circle cx="365" cy="160" r="5.5"/>
    <circle cx="385" cy="163" r="5.5"/>
    <circle cx="405" cy="160" r="5.5"/>
    <circle cx="355" cy="178" r="5.5"/>
    <circle cx="375" cy="175" r="5.5"/>
    <circle cx="395" cy="178" r="5.5"/>
    <circle cx="345" cy="193" r="5.5"/>
    <circle cx="365" cy="190" r="5.5"/>
    <circle cx="385" cy="193" r="5.5"/>
    <circle cx="405" cy="190" r="5.5"/>
    <circle cx="355" cy="208" r="5.5"/>
    <circle cx="375" cy="205" r="5.5"/>
    <circle cx="395" cy="208" r="5.5"/>
    <circle cx="365" cy="220" r="5.5"/>
    <circle cx="385" cy="220" r="5.5"/>
  </g>

  <!-- Coolant channel holes (TPMS simplified as open channels) -->
  <g fill="#ffffff" stroke="#78909c" stroke-width="1">
    <circle cx="340" cy="152" r="3.5"/>
    <circle cx="340" cy="172" r="3.5"/>
    <circle cx="340" cy="192" r="3.5"/>
    <circle cx="420" cy="152" r="3.5"/>
    <circle cx="420" cy="172" r="3.5"/>
    <circle cx="420" cy="192" r="3.5"/>
    <circle cx="380" cy="135" r="3.5"/>
    <circle cx="380" cy="225" r="3.5"/>
  </g>

  <!-- Block label -->
  <text x="380" y="268" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#455a64">Prismatic fuel block</text>
  <text x="380" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#78909c">TRISO in graphite matrix</text>

  <!-- Barrier 3 callout -->
  <rect x="310" y="67" width="140" height="18" rx="3" fill="#607d8b"/>
  <text x="380" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">③ Graphite Matrix</text>

  <!-- Graphite function note -->
  <text x="295" y="340" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#455a64">③ Fuel Element Matrix</text>
  <text x="295" y="355" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#546e7a">Graphite absorbs, delays</text>
  <text x="295" y="367" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#546e7a">fission product diffusion</text>

  <!-- Particle scale note -->
  <text x="380" y="395" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#9e9e9e">360 mm block width</text>

  <!-- ============================================ -->
  <!-- ZOOM LINE 2→3                                -->
  <!-- ============================================ -->
  <line x1="485" y1="140" x2="520" y2="105" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="485" y1="240" x2="520" y2="340" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ============================================ -->
  <!-- PANEL 3: Vessel + Building (Barriers 4 & 5)  -->
  <!-- ============================================ -->

  <!-- Panel background -->
  <rect x="515" y="62" width="300" height="350" rx="6" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Confinement building (Barrier 5) -->
  <rect x="540" y="82" width="250" height="280" rx="8" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="2.5"/>

  <!-- Grade level -->
  <line x1="530" y1="200" x2="800" y2="200" stroke="#8d6e63" stroke-width="2" stroke-dasharray="8,3,2,3"/>
  <text x="803" y="204" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#6d4c41">GRADE</text>

  <!-- Earth fill below grade -->
  <rect x="540" y="200" width="250" height="162" fill="#efebe9" opacity="0.5"/>

  <!-- RCCS air gap -->
  <rect x="560" y="110" width="210" height="240" rx="4" fill="#e0f2f1" stroke="#80cbc4" stroke-width="1"/>

  <!-- RCCS arrows — cold air down (blue) -->
  <g fill="#42a5f5" stroke="none" opacity="0.7">
    <polygon points="567,130 570,122 573,130"/>
    <polygon points="567,160 570,152 573,160"/>
    <polygon points="567,190 570,182 573,190"/>
    <polygon points="567,220 570,212 573,220"/>
    <polygon points="567,250 570,242 573,250"/>
    <polygon points="567,280 570,272 573,280"/>
    <polygon points="567,310 570,302 573,310"/>
  </g>
  <!-- RCCS arrows — hot air up (red) -->
  <g fill="#ef5350" stroke="none" opacity="0.7">
    <polygon points="757,310 760,318 763,310"/>
    <polygon points="757,280 760,288 763,280"/>
    <polygon points="757,250 760,258 763,250"/>
    <polygon points="757,220 760,228 763,220"/>
    <polygon points="757,190 760,198 763,190"/>
    <polygon points="757,160 760,168 763,160"/>
    <polygon points="757,130 760,138 763,130"/>
  </g>

  <!-- Reactor vessel (Barrier 4) -->
  <rect x="590" y="120" width="95" height="210" rx="10" fill="#b0bec5" stroke="#37474f" stroke-width="3.5"/>

  <!-- Core region -->
  <rect x="605" y="155" width="65" height="120" rx="4" fill="#ff8f00" stroke="#ef6c00" stroke-width="1.2" opacity="0.8"/>
  <!-- TRISO particles in core -->
  <g fill="#bf360c" opacity="0.6">
    <circle cx="620" cy="175" r="3"/><circle cx="635" cy="172" r="3"/><circle cx="650" cy="175" r="3"/>
    <circle cx="618" cy="190" r="3"/><circle cx="633" cy="188" r="3"/><circle cx="648" cy="190" r="3"/>
    <circle cx="620" cy="205" r="3"/><circle cx="635" cy="203" r="3"/><circle cx="650" cy="205" r="3"/>
    <circle cx="618" cy="220" r="3"/><circle cx="633" cy="218" r="3"/><circle cx="648" cy="220" r="3"/>
    <circle cx="620" cy="235" r="3"/><circle cx="635" cy="233" r="3"/><circle cx="650" cy="235" r="3"/>
    <circle cx="618" cy="250" r="3"/><circle cx="633" cy="248" r="3"/><circle cx="648" cy="250" r="3"/>
  </g>

  <!-- Turbomachine vessel -->
  <rect x="715" y="160" width="45" height="140" rx="6" fill="#b0bec5" stroke="#37474f" stroke-width="2.5"/>
  <text x="738" y="225" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="bold" fill="#37474f" transform="rotate(-90,738,225)">TURBOMACHINE</text>

  <!-- Cross-vessel -->
  <rect x="685" y="222" width="30" height="14" rx="2" fill="#90a4ae" stroke="#37474f" stroke-width="1.5"/>

  <!-- Barrier 4 callout -->
  <rect x="555" y="67" width="180" height="18" rx="3" fill="#37474f"/>
  <text x="645" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">④ Reactor Vessel  ⑤ Building</text>

  <!-- Barrier 4 label -->
  <text x="540" y="340" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#37474f">④ Helium Pressure Boundary</text>
  <text x="540" y="355" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#546e7a">Steel vessel + primary piping</text>

  <!-- Barrier 5 label -->
  <text x="540" y="378" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#3949ab">⑤ Confinement Building</text>
  <text x="540" y="393" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#546e7a">Low-leakage; passive RCCS</text>

  <!-- Building scale note -->
  <text x="665" y="395" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#9e9e9e">~20 m envelope</text>

  <!-- ============================================ -->
  <!-- Bottom safety note                           -->
  <!-- ============================================ -->
  <rect x="130" y="428" width="580" height="38" rx="6" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1"/>
  <text x="420" y="446" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#2e7d32">Walk-away safe: peak fuel T &lt; 1,600 °C · No operator action · No active systems</text>
  <text x="420" y="460" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#2e7d32">First three barriers retain &gt;99.99% of fission products — the fuel IS the containment</text>
</svg>
