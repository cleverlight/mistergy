<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520">
  <!-- Background -->
  <rect width="800" height="520" fill="#ffffff" rx="6"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#24292f">Direct Helium Brayton Cycle</text>

  <!-- Component boxes -->
  <!-- Reactor Core (top centre) -->
  <rect x="290" y="55" width="220" height="60" rx="6" fill="#c62828" stroke="#b71c1c" stroke-width="2"/>
  <text x="400" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">REACTOR CORE</text>
  <text x="400" y="100" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#ffcdd2">580 °C → 950 °C</text>

  <!-- Turbine (right) -->
  <rect x="590" y="160" width="150" height="55" rx="6" fill="#e65100" stroke="#bf360c" stroke-width="2"/>
  <text x="665" y="183" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">TURBINE</text>
  <text x="665" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#ffe0b2">η = 0.90</text>

  <!-- Generator (far right, attached to shaft) -->
  <rect x="620" y="240" width="90" height="40" rx="4" fill="#4527a0" stroke="#311b92" stroke-width="1.5"/>
  <text x="665" y="265" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">GENERATOR</text>

  <!-- Shaft indicator between turbine/generator/compressor -->
  <line x1="665" y1="215" x2="665" y2="240" stroke="#37474f" stroke-width="4"/>
  <line x1="665" y1="280" x2="665" y2="305" stroke="#37474f" stroke-width="4"/>
  <text x="688" y="298" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#78909c">shaft</text>

  <!-- Compressor (right, below generator) -->
  <rect x="590" y="305" width="150" height="55" rx="6" fill="#0277bd" stroke="#01579b" stroke-width="2"/>
  <text x="665" y="328" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">COMPRESSOR</text>
  <text x="665" y="345" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#b3e5fc">η = 0.88</text>

  <!-- Recuperator (centre) -->
  <rect x="290" y="200" width="220" height="120" rx="6" fill="#00695c" stroke="#004d40" stroke-width="2"/>
  <text x="400" y="228" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">RECUPERATOR</text>
  <text x="400" y="248" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#b2dfdb">ε = 0.95</text>
  <!-- Hot side flow arrow -->
  <text x="400" y="275" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#ffab91">Hot: 600 → 215 °C  ↓</text>
  <!-- Cold side flow arrow -->
  <text x="400" y="295" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#80cbc4">Cold: 195 → 580 °C  ↑</text>
  <!-- Counter-flow arrows -->
  <line x1="340" y1="262" x2="340" y2="308" stroke="#ff8a65" stroke-width="1.5" opacity="0.6"/>
  <polygon points="340,308 336,300 344,300" fill="#ff8a65" opacity="0.6"/>
  <line x1="460" y1="308" x2="460" y2="262" stroke="#4db6ac" stroke-width="1.5" opacity="0.6"/>
  <polygon points="460,262 456,270 464,270" fill="#4db6ac" opacity="0.6"/>

  <!-- Precooler (bottom centre) -->
  <rect x="290" y="395" width="220" height="60" rx="6" fill="#0d47a1" stroke="#0a3280" stroke-width="2"/>
  <text x="400" y="422" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">PRECOOLER</text>
  <text x="400" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#bbdefb">Air-cooled · 215 → 35 °C</text>

  <!-- Connecting pipes with flow arrows and temperature labels -->

  <!-- Core outlet → Turbine (top right) -->
  <path d="M 510 85 L 590 85 L 590 160" fill="none" stroke="#ef5350" stroke-width="3"/>
  <polygon points="590,155 586,145 594,145" fill="#ef5350"/>
  <rect x="530" y="68" width="55" height="18" rx="3" fill="#fff3e0"/>
  <text x="557" y="81" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#e65100">950 °C</text>

  <!-- Turbine outlet → Recuperator hot inlet (right to centre) -->
  <path d="M 590 195 L 560 195 L 560 240 L 510 240" fill="none" stroke="#ff7043" stroke-width="3"/>
  <polygon points="515,240 523,236 523,244" fill="#ff7043"/>
  <rect x="536" y="222" width="50" height="18" rx="3" fill="#fff3e0"/>
  <text x="561" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#e65100">600 °C</text>

  <!-- Recuperator hot outlet → Precooler (centre down) -->
  <path d="M 400 320 L 400 395" fill="none" stroke="#42a5f5" stroke-width="3"/>
  <polygon points="400,390 396,382 404,382" fill="#42a5f5"/>
  <rect x="410" y="345" width="50" height="18" rx="3" fill="#e3f2fd"/>
  <text x="435" y="358" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#0277bd">215 °C</text>

  <!-- Precooler outlet → Compressor (bottom right) -->
  <path d="M 510 430 L 590 430 L 590 360" fill="none" stroke="#1565c0" stroke-width="3"/>
  <polygon points="590,365 586,373 594,373" fill="#1565c0"/>
  <rect x="530" y="432" width="45" height="18" rx="3" fill="#e3f2fd"/>
  <text x="553" y="445" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#0277bd">35 °C</text>

  <!-- Compressor outlet → Recuperator cold inlet (right to centre) -->
  <path d="M 590 325 L 560 325 L 560 285 L 510 285" fill="none" stroke="#26a69a" stroke-width="3"/>
  <polygon points="515,285 523,281 523,289" fill="#26a69a"/>
  <rect x="536" y="298" width="50" height="18" rx="3" fill="#e0f2f1"/>
  <text x="561" y="311" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#00695c">195 °C</text>

  <!-- Recuperator cold outlet → Core inlet (centre up to left side of core) -->
  <path d="M 340 200 L 340 155 L 290 155 L 290 85 L 290 85" fill="none" stroke="#66bb6a" stroke-width="3"/>
  <polygon points="290,90 286,98 294,98" fill="#66bb6a"/>
  <rect x="248" y="140" width="50" height="18" rx="3" fill="#e8f5e9"/>
  <text x="273" y="153" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#2e7d32">580 °C</text>

  <!-- Grid output arrow from generator -->
  <line x1="710" y1="260" x2="745" y2="260" stroke="#4527a0" stroke-width="2.5"/>
  <polygon points="745,260 737,256 737,264" fill="#4527a0"/>
  <text x="755" y="255" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#4527a0">AC</text>
  <text x="755" y="268" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#4527a0">Grid</text>

  <!-- Air rejection from precooler -->
  <line x1="290" y1="430" x2="255" y2="445" stroke="#78909c" stroke-width="1.5"/>
  <line x1="290" y1="420" x2="255" y2="435" stroke="#78909c" stroke-width="1.5"/>
  <line x1="290" y1="440" x2="255" y2="455" stroke="#78909c" stroke-width="1.5"/>
  <text x="220" y="445" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#78909c">waste heat</text>
  <text x="220" y="458" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#78909c">to air</text>

  <!-- Efficiency annotation -->
  <rect x="55" y="65" width="170" height="55" rx="6" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
  <text x="140" y="84" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#24292f">Cycle Efficiency</text>
  <text x="140" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#2e7d32">~47%</text>

  <!-- Pressure annotation -->
  <rect x="55" y="135" width="170" height="42" rx="6" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
  <text x="140" y="153" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#24292f">Primary Pressure</text>
  <text x="140" y="170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0277bd">4 MPa</text>

  <!-- Single working fluid note -->
  <rect x="55" y="192" width="170" height="28" rx="6" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
  <text x="140" y="211" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#57606a">Single fluid · No IHX</text>

  <!-- Pressure ratio -->
  <rect x="55" y="235" width="170" height="28" rx="6" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
  <text x="140" y="254" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#57606a">Pressure ratio: 2.5</text>
</svg>
