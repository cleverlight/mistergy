<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440">
  <!-- Background -->
  <rect width="720" height="440" fill="#ffffff" rx="6"/>

  <!-- Title -->
  <text x="360" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#24292f">TRISO Coated Fuel Particle</text>

  <!-- Particle centred at (210, 230) -->
  <!-- OPyC outer layer -->
  <circle cx="210" cy="230" r="155" fill="#78909c" stroke="#546e7a" stroke-width="1.5"/>
  <!-- SiC layer -->
  <circle cx="210" cy="230" r="140" fill="#00897b" stroke="#00695c" stroke-width="1.5"/>
  <!-- IPyC layer -->
  <circle cx="210" cy="230" r="128" fill="#90a4ae" stroke="#78909c" stroke-width="1"/>
  <!-- Buffer layer (porous — dashed outline) -->
  <circle cx="210" cy="230" r="115" fill="#eceff1" stroke="#b0bec5" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- UO₂ kernel -->
  <circle cx="210" cy="230" r="82" fill="#e65100" stroke="#bf360c" stroke-width="1.5"/>
  <text x="210" y="226" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">UO₂</text>
  <text x="210" y="243" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#ffe0b2">4.8% ²³⁵U</text>

  <!-- Leader lines to labels -->
  <!-- Kernel -->
  <line x1="272" y1="178" x2="435" y2="98" stroke="#9e9e9e" stroke-width="1"/>
  <circle cx="272" cy="178" r="2.5" fill="#9e9e9e"/>
  <text x="440" y="93" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#e65100">UO₂ Kernel</text>
  <text x="440" y="110" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#57606a">500 μm diameter</text>

  <!-- Buffer -->
  <line x1="305" y1="152" x2="435" y2="145" stroke="#9e9e9e" stroke-width="1"/>
  <circle cx="305" cy="152" r="2.5" fill="#9e9e9e"/>
  <text x="440" y="141" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#78909c">Buffer</text>
  <text x="440" y="158" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#57606a">100 μm · Porous PyC</text>

  <!-- IPyC -->
  <line x1="324" y1="172" x2="435" y2="190" stroke="#9e9e9e" stroke-width="1"/>
  <circle cx="324" cy="172" r="2.5" fill="#9e9e9e"/>
  <text x="440" y="186" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#607d8b">IPyC</text>
  <text x="440" y="203" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#57606a">40 μm · Dense PyC</text>

  <!-- SiC -->
  <line x1="340" y1="200" x2="435" y2="235" stroke="#9e9e9e" stroke-width="1"/>
  <circle cx="340" cy="200" r="2.5" fill="#9e9e9e"/>
  <text x="440" y="231" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#00695c">SiC</text>
  <text x="440" y="248" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#57606a">35 μm · β-SiC (CVD)</text>

  <!-- OPyC -->
  <line x1="352" y1="260" x2="435" y2="280" stroke="#9e9e9e" stroke-width="1"/>
  <circle cx="352" cy="260" r="2.5" fill="#9e9e9e"/>
  <text x="440" y="276" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#546e7a">OPyC</text>
  <text x="440" y="293" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#57606a">40 μm · Dense PyC</text>

  <!-- Failure limit note -->
  <text x="440" y="340" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#c62828">Intact to 1,600 °C</text>
  <text x="440" y="357" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#57606a">SiC coating is primary</text>
  <text x="440" y="372" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#57606a">fission product barrier</text>

  <!-- Total OD dimension line -->
  <line x1="55" y1="410" x2="365" y2="410" stroke="#24292f" stroke-width="1"/>
  <line x1="55" y1="404" x2="55" y2="416" stroke="#24292f" stroke-width="1.5"/>
  <line x1="365" y1="404" x2="365" y2="416" stroke="#24292f" stroke-width="1.5"/>
  <polygon points="60,410 68,407 68,413" fill="#24292f"/>
  <polygon points="360,410 352,407 352,413" fill="#24292f"/>
  <text x="210" y="428" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#24292f">Total OD ≈ 930 μm</text>
</svg>
